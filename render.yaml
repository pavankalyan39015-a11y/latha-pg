services:
  - type: web
    name: pg-management-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
